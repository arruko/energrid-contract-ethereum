version: '3.8'

services:
  trading-engine:
    build:
      context: ../
      dockerfile: docker/trading-engine/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - DB_HOST=database
      - REDIS_HOST=redis
      - BLOCKCHAIN_NODE_URL=http://blockchain-node:8080
    depends_on:
      - database
      - redis
      - blockchain-node
    networks:
      - energrid-network
    volumes:
      - ../logs:/app/logs

  blockchain-node:
    build:
      context: ../
      dockerfile: docker/blockchain-node/Dockerfile
    ports:
      - "8081:8080"
      - "8545:8545"
    environment:
      - NODE_ENV=development
      - DB_HOST=database
      - NETWORK=sepolia
    depends_on:
      - database
    networks:
      - energrid-network
    volumes:
      - blockchain-data:/app/data
      - ../logs:/app/logs

  iot-processor:
    build:
      context: ../
      dockerfile: docker/iot-processor/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - TRADING_ENGINE_URL=http://trading-engine:8080
    depends_on:
      - redis
      - trading-engine
    networks:
      - energrid-network
    volumes:
      - ../logs:/app/logs

  database:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=energrid
      - MYSQL_USER=energrid
      - MYSQL_PASSWORD=energridpass
    ports:
      - "3306:3306"
    networks:
      - energrid-network
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - energrid-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - trading-engine
      - blockchain-node
      - iot-processor
    networks:
      - energrid-network

networks:
  energrid-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  blockchain-data:
